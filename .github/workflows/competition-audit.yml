name: Competition coverage read-only audit
on:
  push:
    branches: [feat/competition-coverage]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/audit-competitions.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: competition-coverage-audit
          path: test-artifacts/competition-audit.json
          if-no-files-found: ignore
