name: Automatic football operations
on:
  push:
    branches: [main]
    paths:
      - 'scripts/lib/calculation-archives.mjs'
      - 'scripts/lib/report-reference.ts'
      - 'supabase/migrations/*_verified_checkpoint_archives.sql'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: football-automatic-production
  cancel-in-progress: false
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check server configuration
        run: |
          node -e 'for (const key of ["SUPABASE_URL","SUPABASE_SERVICE_ROLE_KEY","BSD_API_KEY"]) { if (!process.env[key]) { console.error("Missing repository secret: " + key); process.exitCode = 1; } }'
      - run: npm ci
      - name: Prepare report reference using the shared provider budget
        if: github.event_name == 'push'
        run: npm run data:automatic -- --report-reference
      - name: Verify and archive completed work after archive-code deployment
        if: github.event_name == 'push'
        run: npm run data:automatic -- --archives-only
      - name: Daily catalog, finished matches, calculations, rankings and names
        if: github.event_name != 'push'
        run: npm run data:automatic -- --maintenance
