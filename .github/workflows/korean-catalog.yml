name: Apply Korean catalog names
on:
  push:
    branches: [main]
    paths:
      - 'data/localization/*.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: football-automatic-production
  cancel-in-progress: false
jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fill missing Korean names without replacing existing labels
        run: node scripts/apply-korean-names.mjs --apply
